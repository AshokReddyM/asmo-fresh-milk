<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Email confirmation · Asmo Fresh</title><style>body{margin:0;background:#fafbf7;color:#153f35;font:17px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100svh}main{max-width:430px;padding:32px}small{color:#b96846;letter-spacing:2px}h1{font-size:34px;line-height:1.2}p{color:#6b796b}a{display:block;padding:15px 20px;border-radius:18px;background:#153f35;color:#fff;text-align:center;text-decoration:none;margin-top:25px}button{background:none;border:0;color:#153f35;padding:12px;cursor:pointer;font:inherit}</style></head><body><main><small>ASMO FRESH</small><h1 id="title">Email confirmation</h1><p id="message">Asmo Fresh now uses mobile sign-in. Open the app to continue.</p><a href="./" id="open">Open Asmo Fresh</a><p id="mobile">For help linking your existing account to a mobile number, contact Asmo Fresh support.</p><button id="language">తెలుగు</button></main><script>
// Confirmation tokens are intentionally never stored, logged or sent anywhere.
const params=new URLSearchParams(location.hash.slice(1));const failed=params.has('error')||new URLSearchParams(location.search).has('error');const verified=params.has('access_token')&&!failed;
history.replaceState(null,'',location.pathname);
let te=false;function render(){document.documentElement.lang=te?'te':'en';document.getElementById('title').textContent=failed?(te?'లింక్ గడువు ముగిసింది':'This link could not be verified'):verified?(te?'ఇమెయిల్ నిర్ధారణ అయింది':'Email confirmed'):(te?'ఇమెయిల్ నిర్ధారణ':'Email confirmation');document.getElementById('message').textContent=failed?(te?'ఈ ఇమెయిల్ లింక్ గడువు ముగిసింది లేదా ఇప్పటికే వాడారు. మొబైల్ లాగిన్ కోసం యాప్ తెరవండి.':'This email link has expired or was already used. Open Asmo Fresh for mobile sign-in.'):(te?'అస్మో ఫ్రెష్‌లో ఇప్పుడు మొబైల్ లాగిన్ వాడాలి. యాప్ తెరవండి.':'Asmo Fresh now uses mobile sign-in. Open the app to continue.');document.getElementById('open').textContent=te?'అస్మో ఫ్రెష్ తెరవండి':'Open Asmo Fresh';document.getElementById('mobile').textContent=te?'మీ పాత ఖాతాకు మొబైల్ నంబర్ లింక్ చేయడానికి అస్మో ఫ్రెష్ సహాయం కోరండి.':'For help linking your existing account to a mobile number, contact Asmo Fresh support.';document.getElementById('language').textContent=te?'English':'తెలుగు';}document.getElementById('language').onclick=()=>{te=!te;render()};render();
</script></body></html>
