<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Email confirmation · Asmo Fresh</title><style>body{margin:0;background:#fffaf1;color:#174c3c;font:17px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100svh}main{max-width:430px;padding:32px}small{color:#b96846;letter-spacing:2px}h1{font-size:34px;line-height:1.2}p{color:#6b796b}a{display:block;padding:15px 20px;border-radius:18px;background:#174c3c;color:#fff;text-align:center;text-decoration:none;margin-top:25px}button{background:none;border:0;color:#174c3c;padding:12px;cursor:pointer;font:inherit}</style></head><body><main><small>ASMO FRESH</small><h1 id="title">Email confirmation</h1><p id="message">Open Asmo Fresh and sign in with your email and password.</p><a href="./" id="open">Open Asmo Fresh</a><p id="mobile">Using the mobile app? Return to the app and select Email to sign in.</p><button id="language">తెలుగు</button></main><script>
// Confirmation tokens are intentionally never stored, logged or sent anywhere.
const params=new URLSearchParams(location.hash.slice(1));const failed=params.has('error')||new URLSearchParams(location.search).has('error');const verified=params.has('access_token')&&!failed;
history.replaceState(null,'',location.pathname);
let te=false;function render(){document.documentElement.lang=te?'te':'en';document.getElementById('title').textContent=failed?(te?'లింక్ గడువు ముగిసింది':'This link could not be verified'):verified?(te?'ఇమెయిల్ నిర్ధారణ అయింది':'Email confirmed'):(te?'ఇమెయిల్ నిర్ధారణ':'Email confirmation');document.getElementById('message').textContent=failed?(te?'అస్మో ఫ్రెష్‌లో కొత్త ఖాతా నిర్ధారణ ఇమెయిల్ అభ్యర్థించండి.':'Request a fresh confirmation email in Asmo Fresh. The link may have expired or already been used.'):(te?'అస్మో ఫ్రెష్ తెరిచి మీ ఇమెయిల్, పాస్‌వర్డ్‌తో లాగిన్ అవ్వండి.':'Open Asmo Fresh and sign in with your email and password.');document.getElementById('open').textContent=te?'అస్మో ఫ్రెష్ తెరవండి':'Open Asmo Fresh';document.getElementById('mobile').textContent=te?'మొబైల్ యాప్ వాడుతున్నారా? యాప్‌లో ఇమెయిల్ ఎంపికతో లాగిన్ అవ్వండి.':'Using the mobile app? Return to the app and select Email to sign in.';document.getElementById('language').textContent=te?'English':'తెలుగు';}document.getElementById('language').onclick=()=>{te=!te;render()};render();
</script></body></html>
